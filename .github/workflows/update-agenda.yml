name: Update DTS agenda

on:
  schedule:
    - cron: "0 5 * * *"     # elke dag 05:00 UTC (06:00/07:00 NL)
  workflow_dispatch:        # handmatig starten via de Actions-tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Script draaien
        run: |
          pip install beautifulsoup4 tzdata
          python dts_agenda.py

      - name: Wijzigingen opslaan
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add dts-ede-4.ics wedstrijden.json
          git diff --cached --quiet || git commit -m "Agenda bijgewerkt"
          git push
